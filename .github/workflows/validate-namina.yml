name: NAMINA Code Validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  typecheck-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx tsx --test tests/vini-template.test.ts tests/mobile-video-preview.test.ts tests/admin-publish-no-deploy.test.ts
      - run: npm run build
