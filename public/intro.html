<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#020202" />
  <meta name="description" content="NAMINA.PRO — website personal sinematik dengan karakter interaktif." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>NAMINA | Cinematic Intro</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #020202; }
    body { font-family: Montserrat, Arial, sans-serif; color: #fff; }
    .intro { position: fixed; inset: 0; width: 100%; height: 100vh; height: 100dvh;
      overflow: hidden; background: #020202; display: flex; align-items: center; justify-content: center; }
    .intro-video { display: block; width: 100%; height: 100%; object-fit: contain; background: #000;
      opacity: 0; visibility: hidden; }
    .entry { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 16px;
      align-items: center; justify-content: center; padding: 24px;
      background: radial-gradient(ellipse at 50% 50%, #20090c 0%, #080304 44%, #000 85%); }
    .open { display: inline-flex; align-items: center; justify-content: center; min-width: 230px;
      min-height: 62px; padding: 19px 32px; border: 1px solid rgba(255,255,255,.6);
      border-radius: 4px; background: #b71825; box-shadow: 0 12px 38px rgba(135,9,20,.35);
      color: #fff; font-size: clamp(16px, 4vw, 21px); line-height: 1.2; font-weight: 800;
      letter-spacing: .12em; text-align: center; text-decoration: none;
      -webkit-tap-highlight-color: transparent; touch-action: manipulation; cursor: pointer; }
    .open:hover { background: #d31b2c; }
    .open:focus-visible { outline: 3px solid #fff; outline-offset: 5px; }
    .status { color: #f4caca; font-size: 14px; font-weight: 500; line-height: 1.5; text-align: center; margin: 0; max-width: 320px; }
    .intro.is-playing .intro-video { opacity: 1; visibility: visible; }
    .intro.is-playing .entry { display: none; }
    @media (prefers-reduced-motion: reduce) { .open { transition: none; } }
  </style>
  <script src="/namina-intro.js" defer></script>
</head>
<body>
  <main class="intro" id="intro" aria-label="Intro sinematik NAMINA">
    <video id="intro-video" class="intro-video" playsinline webkit-playsinline loop preload="none"
      src="https://www.dropbox.com/scl/fi/r0pk04lqyqgxvlyq6r2wp/Namina_logo_reveal_animation_9149f6a7_1080p.mp4?rlkey=oegcrx65yg2fjmi4xfpt98xf0&amp;raw=1"
      aria-label="Animasi logo NAMINA dengan suara"></video>
    <div class="entry" id="intro-entry">
      <a class="open" id="open-namina"
        href="https://www.dropbox.com/scl/fi/r0pk04lqyqgxvlyq6r2wp/Namina_logo_reveal_animation_9149f6a7_1080p.mp4?rlkey=oegcrx65yg2fjmi4xfpt98xf0&amp;raw=1">BUKA NAMINA</a>
      <p class="status" id="intro-status" role="status" hidden></p>
    </div>
  </main>
</body>
</html>
